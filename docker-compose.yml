# Local build/run for testing before deploying to EC2.
#
#   docker compose up --build
#
# Then visit http://localhost:8000
#
# YouTube downloads: cloud IPs (including EC2) are often blocked by YouTube's
# bot-check ("Sign in to confirm you're not a bot"). To fix, export cookies
# from a logged-in browser session (e.g. with the "Get cookies.txt" extension)
# to ./cookies.txt at the repo root, then set YT_DLP_COOKIES_FILE and mount
# the file as shown below.

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - YT_DLP_COOKIES_FILE=/app/cookies.txt
    volumes:
      - ./media:/app/media
      - ./signalcare.db:/app/signalcare.db
      - ./cookies.txt:/app/cookies.txt:ro
